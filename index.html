<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Blog preview card</title>
</head>

<body>


  <main>
    <article class="card">
      <div class="card-img">
        <img src="/assets/images/illustration-article.svg" alt="card abstract img">
      </div>
      <div class="card-body">
        <div class="card-text">
          <span class="card-badge">Learning</span>
          <span>Published 21 Dec 2023</span>
          <h1>HTML &amp; CSS foundations</h1>
          <p class="card-copy">
            these languages are the backbone of every website, defining structure, content and presentation.
          </p>
          <div class="card-info-area">
            <img src="/assets/images/image-avatar.webp" alt="Greg Hooper picture">
            <h2 class="author-name">Greg Hooper</h2>
          </div>
        </div>
      </div>
    </article>
  </main>
</body>

</html>
